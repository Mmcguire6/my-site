# Netlify config for northernpeaksystems.ca
# The contact form posts to /api/contact, which proxies to the function below.
# Set RESEND_API_KEY (and optionally TO_EMAIL / FROM_EMAIL) in
# Netlify → Site settings → Environment variables.

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Self-serve checkout (see docs/checkout-setup.md)
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

# package links to send after a demo or call: /start/base, /start/peak (?ref=demo etc. is kept)
[[redirects]]
  from = "/start/*"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/onboarding"
  to = "/.netlify/functions/onboarding"
  status = 200

# source, setup notes and tests are not public pages
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# --- 301s for moved/retired pages (generated) ---
# Local SEO is part of Websites & SEO now (force: the old file may still exist); everything else was deleted.
[[redirects]]
  from = "/features/local-seo"
  to = "/features/website"
  status = 301
  force = true

[[redirects]]
  from = "/features/local-seo.html"
  to = "/features/website"
  status = 301
  force = true

