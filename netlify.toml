# Netlify config for northernpeaksystems.ca
# The contact form posts to /api/contact, which proxies to the function below.
# Set RESEND_API_KEY (and optionally TO_EMAIL / FROM_EMAIL) in
# Netlify → Site settings → Environment variables.

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
