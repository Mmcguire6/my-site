<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="16" fill="#0a0e1a"/>

  <!-- Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#ai)" opacity="0.12"/>

  <!-- Analytics bars - continuously ascending (left to right) -->
  <g opacity="0.9">
    <rect x="14" y="40" width="4" height="8" rx="2" fill="#22d3ee" filter="drop-shadow(0 0 6px rgba(34, 211, 238, 0.4))"/>
    <rect x="20" y="36" width="4" height="12" rx="2" fill="#22d3ee" filter="drop-shadow(0 0 6px rgba(34, 211, 238, 0.4))"/>
    <rect x="26" y="32" width="4" height="16" rx="2" fill="#6366f1" filter="drop-shadow(0 0 6px rgba(99, 102, 241, 0.4))"/>
    <rect x="32" y="28" width="4" height="20" rx="2" fill="#6366f1" filter="drop-shadow(0 0 6px rgba(99, 102, 241, 0.4))"/>
    <rect x="38" y="24" width="4" height="24" rx="2" fill="#a855f7" filter="drop-shadow(0 0 6px rgba(168, 85, 247, 0.4))"/>
    <rect x="44" y="20" width="4" height="28" rx="2" fill="#a855f7" filter="drop-shadow(0 0 6px rgba(168, 85, 247, 0.4))"/>
  </g>

  <!-- AI neural connections overlaying the analytics -->
  <g opacity="0.7">
    <!-- Connection lines (neural pathways) -->
    <path d="M 16 42 Q 22 38 28 34" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <path d="M 22 38 Q 28 32 34 30" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
    <path d="M 28 34 Q 34 28 40 26" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
    <path d="M 34 30 Q 38 26 46 22" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>

    <!-- Neural nodes on the bars -->
    <circle cx="16" cy="42" r="2.5" fill="#22d3ee" filter="drop-shadow(0 0 4px rgba(34, 211, 238, 0.6))"/>
    <circle cx="22" cy="38" r="2.5" fill="#22d3ee" filter="drop-shadow(0 0 4px rgba(34, 211, 238, 0.6))"/>
    <circle cx="28" cy="34" r="2.5" fill="#6366f1" filter="drop-shadow(0 0 4px rgba(99, 102, 241, 0.6))"/>
    <circle cx="34" cy="30" r="2.5" fill="#6366f1" filter="drop-shadow(0 0 4px rgba(99, 102, 241, 0.6))"/>
    <circle cx="40" cy="26" r="2.5" fill="#a855f7" filter="drop-shadow(0 0 4px rgba(168, 85, 247, 0.6))"/>
    <circle cx="46" cy="22" r="2.5" fill="#a855f7" filter="drop-shadow(0 0 4px rgba(168, 85, 247, 0.6))"/>
  </g>

  <!-- Central AI processor/brain -->
  <g filter="drop-shadow(0 0 12px rgba(99, 102, 241, 0.7))">
    <circle cx="32" cy="16" r="8" fill="url(#ai)"/>
    <circle cx="32" cy="16" r="5" fill="#0a0e1a" opacity="0.3"/>
    <circle cx="32" cy="16" r="3" fill="#ffffff" opacity="0.9"/>

    <!-- Connection from brain to data -->
    <line x1="32" y1="24" x2="32" y2="28" stroke="url(#ai)" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
