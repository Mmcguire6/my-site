            <!-- Contact form -->
            <div class="ac-block">
                <p class="ac-section-label">Send a Message</p>
                <!-- Replace YOUR_FORM_ID with your Formspree form ID at formspree.io -->
                <form class="ac-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <div class="form-row">
                        <label class="form-label" for="name">Name</label>
                        <input class="form-input" id="name" name="name" type="text" placeholder="Your name" required>
                    </div>
                    <div class="form-row">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-input" id="email" name="email" type="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-row form-row--area">
                        <label class="form-label" for="message">Message</label>
                        <textarea class="form-input form-textarea" id="message" name="message" placeholder="Tell me about your project..." required></textarea>
                    </div>
                    <div class="form-footer">
                        <button class="submit-btn" type="submit">Send Message</button>
                    </div>
                </form>
            </div>
